<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./assest/css/style.css">
    <title>WhatsApp Clone</title>
</head>
<body>
    <div class="container">
        <nav class="navbar">
            <img src="/assest/images/whatsapplogo.png" alt="">
            <div class="nav-itmes">
                <div class="features">
                    <p>Features</p>
                    <img src="./assest/images/left-arrow.png" class="feature-icon" alt="">
                </div>
                <p class="slide">Privacy</p>
                <p>Blog</p>
                <p>Apps</p>
                <p class="help-center">Help Center
                    <img src="./assest/images/left-arrow-icon.png" alt="">
                </p>
                <p class="help-center">For Business
                    <img src="./assest/images/left-arrow-icon.png" class="feature-icon" alt="">
                </p>
            </div>
            <div class="right-nav-btn">
                <button>
                    <p>Log in</p>
                    <img src="./assest/images/left-arrow.png" class="login-icon" alt="">
                </button>
                <button class="download">
                    <p>Download</p>
                    <img src="./assest/images/downloadarrow.png" alt="">
                </button>
            </div>
        </nav>
        <section class="hero">
            <div class="hero-container">
                <div class="hero-left">
                    <div class="message">
                        <h1>Message <br> privately</h1>
                        <p>Simple, reliable, private messaging and <br> calling for free*, available all over the <br> world.</p>
                    </div>
                    <button class="download btn">
                        <p>Download</p>
                        <img src="./assest/images/downloadarrow.png" alt="">
                    </button>
                </div>
                <div class="hero-right">
                    <img src="assest/images/userfrench.png" alt="">
                    <img src="assest/images/studingtooltip.png" alt="">
                    <img src="assest/images/usercharptooltip.png" alt="">
                    <img src="assest/images/likeheartpng.png" alt="">
                </div>
            </div>
            <p>* Data charges may apply. Contact your provider for details.</p>
        </section>
    </div>
</body>
</html>
